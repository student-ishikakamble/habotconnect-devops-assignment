name: HabotConnect CI - Poka-Yoke Security Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  security-and-quality-gate:
    name: Fail-Closed Security Gate
    runs-on: ubuntu-latest

    steps:
      # ===================================================
      # SOURCE
      # ===================================================

      - name: Checkout source code
        uses: actions/checkout@v4

      # ===================================================
      # PYTHON QUALITY GATES
      # ===================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Python lint check
        run: |
          ruff check django

      - name: Python formatting check
        run: |
          ruff format --check django

      # ===================================================
      # TERRAFORM QUALITY GATES
      # ===================================================

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Terraform validation
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      # ===================================================
      # HARD-CODED SECRET GATE
      # ===================================================

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===================================================
      # TERRAFORM SECURITY GATE
      # ===================================================

      - name: IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          skip_check: CKV_GCP_62

      # ===================================================
      # FAIL-CLOSED CONFIRMATION
      # ===================================================

      - name: Security gate passed
        run: |
          echo "=============================================="
          echo "HabotConnect Poka-Yoke Security Gate PASSED"
          echo "=============================================="
          echo "Python linting: PASSED"
          echo "Python formatting: PASSED"
          echo "Terraform formatting: PASSED"
          echo "Terraform validation: PASSED"
          echo "Hard-coded secret scan: PASSED"
          echo "Terraform security scan: PASSED"
          echo "Build is permitted to continue."