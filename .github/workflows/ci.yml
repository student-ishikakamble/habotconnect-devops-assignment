name: HabotConnect CI - Poka-Yoke Security Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  security-and-quality-gate:
    name: Fail-Closed Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Python lint check
        run: |
          python -m ruff check onboarding

      - name: Python formatting check
        run: |
          python -m ruff format --check onboarding

      - name: Django system check
        run: |
          python manage.py check

      - name: Django tests
        run: |
          python manage.py test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Terraform validation
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          skip_check: CKV_GCP_62,CKV_GCP_81

      - name: Security gate passed
        run: |
          echo "=============================================="
          echo "HabotConnect Poka-Yoke Security Gate PASSED"
          echo "=============================================="
          echo "Python linting: PASSED"
          echo "Python formatting: PASSED"
          echo "Django system check: PASSED"
          echo "Django tests: PASSED"
          echo "Terraform formatting: PASSED"
          echo "Terraform validation: PASSED"
          echo "Hard-coded secret scan: PASSED"
          echo "Terraform security scan: PASSED"
          echo "Build is permitted to continue."